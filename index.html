<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Truco Uruguayo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <style>[hidden] { display: none !important; }</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="suit-espada" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1.2l3.1 12H8.9z"/>
        <rect x="6.2" y="13.6" width="11.6" height="2.1" rx="1"/>
        <rect x="11" y="16.1" width="2" height="4.4" rx="1"/>
        <circle cx="12" cy="21.6" r="1.5"/>
      </symbol>
      <symbol id="suit-basto" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10.1 2.7c2.2-1.2 4.6-.1 5.1 2.1l2.7 12.4c.5 2.1-.9 4.1-3 4.3-2 .2-3.6-1.2-3.9-3.2L9.1 6.1c-.2-1.4.1-2.8 1-3.4z"/>
        <circle cx="14.6" cy="4.6" r="1.6"/>
        <circle cx="9.6" cy="7.8" r="1.4"/>
      </symbol>
      <symbol id="suit-oro" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="9.2"/>
        <circle cx="12" cy="12" r="5.4" fill="#fff" fill-opacity=".4"/>
        <circle cx="12" cy="12" r="2.4" fill-opacity=".6"/>
      </symbol>
      <symbol id="suit-copa" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4.8 2.8h14.4v3.4a7.2 7.2 0 0 1-5.7 7v3.3h3.3v2.7H7.2v-2.7h3.3v-3.3a7.2 7.2 0 0 1-5.7-7z"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <h1 class="brand">Truco Uruguayo <span>· a 30 puntos</span></h1>
      <div class="scoreboard">
        <div class="score" id="score-p">
          <div class="who">Vos</div>
          <div class="pts">0</div>
          <div class="stage">0 malas</div>
        </div>
        <div class="score" id="score-a">
          <div class="who">La IA</div>
          <div class="pts">0</div>
          <div class="stage">0 malas</div>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="refpanel">
        <details id="refdetails">
          <summary>Guía: orden de cartas y puntos</summary>
          <div class="refcontent" id="refcontent"></div>
        </details>
      </aside>

      <main class="table-area">
        <section class="seat ai" id="seat-a" aria-label="Mano de la IA">
          <div class="avatar" id="avatar-a">
            <div class="face">🤖</div>
            <div class="name">La IA</div>
          </div>
          <div class="hand" id="hand-a"></div>
        </section>

        <section class="center" aria-label="Mesa">
          <div class="deck-zone">
            <div class="deck-stack">
              <div class="card back"></div>
              <div id="muestra-slot"></div>
            </div>
            <div class="label">Muestra</div>
          </div>
          <div class="pit">
            <div class="pit-row">
              <div class="slot" id="slot-a"><div class="tag">IA</div></div>
              <div class="slot" id="slot-p"><div class="tag">Vos</div></div>
            </div>
            <div class="tricks" id="tricks" aria-label="Bazas"></div>
          </div>
        </section>

        <section class="seat player" id="seat-p" aria-label="Tu mano">
          <div class="avatar" id="avatar-p">
            <div class="face">🧉</div>
            <div class="name">Vos</div>
          </div>
          <div class="hand mine" id="hand-p"></div>
        </section>

        <section class="actions" aria-label="Acciones">
          <div class="prompt" id="prompt"></div>
          <div class="btnrow" id="btnrow"></div>
        </section>
      </main>

      <aside class="sidelog">
        <h2>Partida</h2>
        <ul class="loglist" id="loglist"></ul>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast" hidden>
    <div class="big"></div>
    <div class="small"></div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <h2></h2>
      <p></p>
      <button class="act" id="btn-rematch">Revancha</button>
    </div>
  </div>

  <script type="module" src="js/ui.js?v=2"></script>
</body>
</html>
